name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
        env:
          CGO_ENABLED: "0"
      - name: test
        run: go test ./... -count=1
        env:
          CGO_ENABLED: "0"
      - name: smoke plan
        run: |
          go build -o relay-install ./cmd/relay-install
          ./relay-install plan
        shell: bash
        env:
          CGO_ENABLED: "0"

  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        run: |
          ext=""; [ "${{ matrix.target.goos }}" = "windows" ] && ext=".exe"
          GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -o "relay-install-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${ext}" ./cmd/relay-install
        env:
          CGO_ENABLED: "0"
